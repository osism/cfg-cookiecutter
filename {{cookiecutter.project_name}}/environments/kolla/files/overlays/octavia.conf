[nova]
enable_anti_affinity = true
anti_affinity_policy = soft-anti-affinity
{#- Up to 2025.1 kolla runs octavia-api under Apache mod_wsgi, which ignores
    X-Forwarded-Proto. From 2025.2 on it uses uWSGI, which honours it. #}
{%- if cookiecutter.openstack_version in ["2024.1", "2024.2", "2025.1"] %}

[oslo_middleware]
enable_proxy_headers_parsing = true
{%- endif %}
