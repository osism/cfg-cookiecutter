# Neutron ML2 overlay.
#
# Kolla merges exactly one filename from node_custom_config/neutron/ into
# ml2_conf.ini, and it matches by exact name. A file named ml2.conf, or one
# placed at the overlays top level instead of under neutron/, is silently
# ignored: the deploy succeeds and the settings below never reach Neutron.
#
# [ovn] dns_servers are the resolvers OVN advertises to instances over DHCP.
# Neutron picks them by a three-level precedence: the subnet's own
# dns_nameservers, else this option, else the resolvers on the neutron-server
# host. That last level is a trap on OSISM: the resolvconf role points
# /etc/resolv.conf at systemd-resolved's 127.0.0.53 stub, Kolla runs containers
# with network_mode=host and no resolv.conf bind-mount, and Neutron does not
# filter loopback -- so without this setting any subnet that carries no
# nameservers of its own advertises a dead resolver to its instances.
#
# https://docs.openstack.org/neutron/latest/admin/config-dns-res.html
[ovn]
dns_servers = {{ cookiecutter.name_server.replace(',', ' ').split() | join(', ') }}

# Provider network MTU, left commented; see global_physnet_mtu in neutron.conf.
# physnet1 is this template's flat provider network.
#
# [ml2]
# physical_network_mtus = physnet1:1500
