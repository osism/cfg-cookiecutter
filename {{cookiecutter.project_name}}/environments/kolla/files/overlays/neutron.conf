[DEFAULT]
# Increase pool size and timeout to prevent missing ovs flow table entries
rpc_response_timeout = 600
rpc_conn_pool_size = 120
# Must name a zone from neutron_ovn_availability_zones (environments/kolla).
# OVN external ports (Ironic, SR-IOV) get an empty ha_chassis_group when zones
# are configured but a network carries no availability zone hint.
default_availability_zones = nova
# MTU example, left commented because the values depend on the underlay.
# global_physnet_mtu is the MTU of the physical network: with 1558, Geneve
# networks get 1500 (1558 minus the tunnel overhead). Flat and VLAN networks
# get it too; where their physical network only carries 1500-byte frames,
# lower their MTU with physical_network_mtus in neutron/ml2_conf.ini.
#
# See "MTU Considerations" in
# https://osism.tech/docs/guides/configuration-guide/openstack/neutron
# global_physnet_mtu = 1558
