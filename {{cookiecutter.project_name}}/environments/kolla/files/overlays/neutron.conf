[DEFAULT]
# Increase pool size and timeout to prevent missing ovs flow table entries
rpc_response_timeout = 600
rpc_conn_pool_size = 120
# Must name a zone from neutron_ovn_availability_zones (environments/kolla).
# OVN external ports (Ironic, SR-IOV) get an empty ha_chassis_group when zones
# are configured but a network carries no availability zone hint.
default_availability_zones = nova
