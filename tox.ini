[tox]
skipsdist = true
envlist = py3

[testenv]
passenv =
    OPENSTACK_VERSION
    WITH_CEPH
deps =
    -rrequirements.txt

[testenv:cookiecutter]
commands =
    cookiecutter --no-input . openstack_version={env:OPENSTACK_VERSION} with_ceph={env:WITH_CEPH:1}
    python3 scripts/check-kolla-secrets.py configuration
    python3 scripts/check-ceph-pruning.py configuration {env:WITH_CEPH:1}
